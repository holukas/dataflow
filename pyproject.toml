[project]
name = "dataflow"
version = "0.22.0"
description = ""
authors = [
    { name = "Lukas Hörtnagl", email = "31772692+holukas@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.1.0",
    "pyyaml>=6.0.1",
    "flask>=2.3.3",
    "single-source>=0.3.0",
    "wcmatch>=8.5",
    "urllib3==1.26.18",
    "influxdb-client>=1.44.0",
]

[project.scripts]
dataflow = "dataflow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataflow"]
